name: .NET checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: dotnet test Oauth2_backend.sln --configuration Release
